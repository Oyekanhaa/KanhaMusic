help_admin: "⊚ <b><u>ᴀᴅᴍɪɴ ᴄᴏᴍᴍᴀɴᴅs :</u></b>\n\n<blockquote>💮 <b>ᴊᴜsᴛ ᴀᴅᴅ ᴄ ᴀs ᴀ ᴘʀᴇғɪx ᴛᴏ ᴛʜᴇ ᴄᴏᴍᴍᴀɴᴅs ᴛᴏ ᴄᴏɴᴛʀᴏʟ ᴄʜᴀɴɴᴇʟ sᴛʀᴇᴀᴍɪɴɢ.</b></blockquote>\n\n<blockquote>➻ <b>/pause</b> : ʜᴀʟᴛ ᴛʜᴇ ᴄᴜʀʀᴇɴᴛʟʏ ᴀᴄᴛɪᴠᴇ sᴛʀᴇᴀᴍ.\n➻ <b>/resume</b> : ʀᴇsᴛᴀʀᴛ ᴛʜᴇ ᴘᴀᴜsᴇᴅ ᴘʟᴀʏʙᴀᴄᴋ.\n➻ <b>/skip</b> : ᴘʟᴀʏ ᴛʜᴇ ɴᴇxᴛ ᴛʀᴀᴄᴋ ɪɴ ᴛʜᴇ ǫᴜᴇᴜᴇ.\n➻ <b>/askip</b> : ᴘʟᴀʏ ᴛʜᴇ ɴᴇxᴛ ᴛʀᴀᴄᴋ ɪɴ ᴛʜᴇ ᴀᴜᴛᴏᴘʟᴀʏ ǫᴜᴇᴜᴇ.\n➻ <b>/stop</b> : ᴄᴇᴀsᴇ ᴛʜᴇ sᴛʀᴇᴀᴍ ᴀɴᴅ ᴇᴍᴘᴛʏ ǫᴜᴇᴜᴇ.\n➻ <b>/mute</b> : ᴍᴜᴛᴇ ᴘʟᴀʏʙᴀᴄᴋ ɪɴ ᴠɪᴅᴇᴏᴄʜᴀᴛ.\n➻ <b>/unmute</b> : ᴜɴᴍᴜᴛᴇ ᴘʟᴀʏʙᴀᴄᴋ ɪɴ ᴠɪᴅᴇᴏᴄʜᴀᴛ.\n➻ <b>/queue</b> : ᴠɪᴇᴡ ᴛʜᴇ ʟɪsᴛ ᴏғ ᴜᴘᴄᴏᴍɪɴɢ ᴛʀᴀᴄᴋs.\n➻ <b>/jump</b> : ᴊᴜᴍᴘ ᴛᴏ ᴀ ɢɪᴠᴇɴ ᴛɪᴍᴇ ɪɴ ᴛʀᴀᴄᴋ.\n➻ <b>/move</b> : ᴍᴏᴠᴇ ᴀ ǫᴜᴇᴜᴇᴅ ᴛʀᴀᴄᴋ ᴛᴏ ᴀɴᴏᴛʜᴇʀ ᴘᴏsɪᴛɪᴏɴ.\n➻ <b>/clear</b> : ᴄʟᴇᴀʀ ᴀʟʟ sᴏɴɢs ғʀᴏᴍ ǫᴜᴇᴜᴇ.\n➻ <b>/remove</b> : ʀᴇᴍᴏᴠᴇ ᴀ sᴘᴇᴄɪғɪᴄ ᴛʀᴀᴄᴋ ғʀᴏᴍ ǫᴜᴇᴜᴇ.\n➻ <b>/loop [1-10]</b> : ʀᴇᴘᴇᴀᴛ ᴛʜᴇ ᴄᴜʀʀᴇɴᴛʟʏ ᴘʟᴀʏɪɴɢ sᴏɴɢ.\n➻ <b>/shuffle</b> : ʀᴀɴᴅᴏᴍɪᴢᴇ ᴛʜᴇ ǫᴜᴇᴜᴇᴅ ᴘʟᴀʏʟɪsᴛ.\n➻ <b>/seek [sᴇᴄs]</b> : ғᴏʀᴡᴀʀᴅ sᴇᴇᴋ ᴛᴏ ᴀ sᴘᴇᴄɪғɪᴄ ᴛɪᴍᴇ.\n➻ <b>/seekback [sᴇᴄs]</b> : ʀᴇᴠᴇʀsᴇ sᴇᴇᴋ ᴛᴏ ᴀ sᴘᴇᴄɪғɪᴄ ᴛɪᴍᴇ.\n➻ <b>/speed</b> : ᴍᴏᴅɪғʏ ᴘʟᴀʏʙᴀᴄᴋ sᴘᴇᴇᴅ (0.5x - 2.0x).\n➻ <b>/playmode</b> : ᴄᴏɴᴛʀᴏʟ ᴡʜᴏ ᴄᴀɴ ᴜsᴇ /ᴘʟᴀʏ ᴄᴍᴅ.\n➻ <b>/cmddelete</b> : ᴛᴏɢɢʟᴇ ᴀᴜᴛᴏᴍᴀᴛɪᴄ ᴅᴇʟᴇᴛɪᴏɴ ᴏғ ʙᴏᴛ ᴄᴏᴍᴍᴀɴᴅs.</blockquote>\n"

help_auth: "⊚ <b><u>ᴀᴜᴛʜ ᴜsᴇʀs :</u></b>\n\n<blockquote>💮 <b>ᴀᴜᴛʜ ᴜsᴇʀs ᴀʀᴇ ɢʀᴀɴᴛᴇᴅ ᴀᴅᴍɪɴ ᴘʀɪᴠɪʟᴇɢᴇs ᴡɪᴛʜᴏᴜᴛ ʀᴇǫᴜɪʀɪɴɢ ɢʀᴏᴜᴘ ᴀᴅᴍɪɴ sᴛᴀᴛᴜs ᴛᴏ ᴍᴀɴᴀɢᴇ sᴛʀᴇᴀᴍs.</b></blockquote>\n\n<blockquote>➻ <b>/auth [ᴜsᴇʀ]</b> : ᴀᴅᴅ ᴜsᴇʀ ᴛᴏ ᴀᴜᴛʜᴏʀɪᴢᴇᴅ ʟɪsᴛ.\n➻ <b>/unauth [ᴜsᴇʀ]</b> : ʀᴇᴍᴏᴠᴇ ᴜsᴇʀ ғʀᴏᴍ ᴀᴜᴛʜᴏʀɪᴢᴇᴅ ʟɪsᴛ.\n➻ <b>/authlist</b> : ᴅɪsᴘʟᴀʏ ᴀʟʟ ᴀᴜᴛʜᴏʀɪᴢᴇᴅ ᴍᴇᴍʙᴇʀs.</blockquote>\n"

help_bcast: "⊚ <b><u>ʙʀᴏᴀᴅᴄᴀsᴛ ғᴇᴀᴛᴜʀᴇ [ᴏɴʟʏ ғᴏʀ sᴜᴅᴏᴇʀs] :</u></b>\n\n<blockquote>➻ <b>/broadcast [ᴍᴇssᴀɢᴇ ᴏʀ ʀᴇᴩʟʏ]</b> : sᴇɴᴅ ᴛᴏ ᴀʟʟ ᴄʜᴀᴛs.\n\n➻ <b>ᴍᴏᴅᴇs</b> :\n<b>-pin</b> : ᴩɪɴ ᴛʜᴇ ᴍᴇssᴀɢᴇ\n<b>-pinloud</b> : ᴩɪɴ + ɴᴏᴛɪғʏ ᴍᴇᴍʙᴇʀs\n<b>-user</b> : ʙʀᴏᴀᴅᴄᴀsᴛ ᴛᴏ sᴛᴀʀᴛᴇᴅ ᴜsᴇʀs\n<b>-assistant</b> : sᴇɴᴅ ᴠɪᴀ ᴀssɪsᴛᴀɴᴛ\n<b>-nobot</b> : ᴅᴏɴ'ᴛ sᴇɴᴅ ғʀᴏᴍ ʙᴏᴛ\n\n⊚ Example : /broadcast -user -pin Testing broadcast</blockquote>\n"

help_play: "⊚ <b><u>ᴘʟᴀʏ & ᴄʜᴀɴɴᴇʟ ᴘʟᴀʏ :</u></b>\n\n<blockquote>➻ <b>/play</b> : sᴛᴀʀᴛ ᴀᴜᴅɪᴏ sᴛʀᴇᴀᴍɪɴɢ ɪɴ ᴄʜᴀᴛ.\n➻ <b>/vplay</b> : sᴛᴀʀᴛ ᴠɪᴅᴇᴏ sᴛʀᴇᴀᴍɪɴɢ ɪɴ ᴄʜᴀᴛ.\n➻ <b>/playforce</b> : ɪɴsᴛᴀɴᴛ ᴘʟᴀʏ (ᴏᴠᴇʀʀɪᴅᴇs ǫᴜᴇᴜᴇ).</blockquote>\n\n⊚ <b><u>ᴄʜᴀɴɴᴇʟ ᴘʟᴀʏ :</u></b>\n\n<blockquote>➻ <b>/cplay</b> : ᴀᴜᴅɪᴏ sᴛʀᴇᴀᴍ ɪɴ ʟɪɴᴋᴇᴅ ᴄʜᴀɴɴᴇʟ.\n➻ <b>/cvplay</b> : ᴠɪᴅᴇᴏ sᴛʀᴇᴀᴍ ɪɴ ʟɪɴᴋᴇᴅ ᴄʜᴀɴɴᴇʟ.\n➻ <b>/cplayforce</b> : ғᴏʀᴄᴇ sᴛʀᴇᴀᴍ ɪɴ ʟɪɴᴋᴇᴅ ᴄʜᴀɴɴᴇʟ.\n➻ <b>/channelplay [ɪ¢]</b> : ᴄᴏɴɴᴇᴄᴛ ᴄʜᴀɴɴᴇʟ ᴛᴏ ᴛʜɪs ɢʀᴏᴜᴘ.</blockquote>\n"

help_sudo: "⊚ <b><u>sʏsᴛᴇᴍ & sᴜᴅᴏ ᴍᴀɴᴀɢᴇᴍᴇɴᴛ :</u></b>\n\n<blockquote>💮 <b>ᴍᴀɴᴀɢᴇ ʟᴏɢs, ᴀɴᴅ ᴀᴅᴍɪɴɪsᴛʀᴀᴛɪᴠᴇ ᴘʀɪᴠɪʟᴇɢᴇs ᴏғ ʏᴏᴜʀ ʙᴏᴛ.</b></blockquote>\n\n<blockquote>➻ <b>ʙᴏᴛ ʟᴏɢs & ᴍᴀɪɴᴛᴇɴᴀɴᴄᴇ</b> :\n➻ <b>/logs</b> : ɢᴇᴛ ʀᴇᴀʟ-ᴛɪᴍᴇ ʟᴏɢs ᴏғ ᴛʜᴇ ʙᴏᴛ.\n➻ <b>/logger</b> : [ᴇɴᴀʙʟᴇ/ᴅɪsᴀʙʟᴇ] ʙᴏᴛ ᴀᴄᴛɪᴠɪᴛʏ ʟᴏɢɢɪɴɢ.\n➻ <b>/maintenance</b> : [ᴇɴᴀʙʟᴇ/ᴅɪsᴀʙʟᴇ] ᴍᴀɪɴᴛᴇɴᴀɴᴄᴇ ᴍᴏᴅᴇ.\n➻ <b>/eval</b> : ᴇxᴇᴄᴜᴛᴇ ɢᴏ ᴄᴏᴅᴇ sɴɪᴘᴘᴇᴛs.\n➻ <b>/sh</b> : ʀᴜɴ sʜᴇʟʟ ᴄᴏᴍᴍᴀɴᴅs.</blockquote>\n\n⊚ <b><u>ᴀᴄᴛɪᴠᴇ sᴛʀᴇᴀᴍs :</u></b>\n\n<blockquote>➻ <b>/activevoice</b> : ᴠɪᴇᴡ ᴏɴɢᴏɪɴɢ ᴀᴜᴅɪᴏ sᴇssɪᴏɴs.\n➻ <b>/ac</b> : ᴠɪᴇᴡ ᴀʟʟ ᴄᴏᴍʙɪɴᴇᴅ ᴀᴄᴛɪᴠᴇ sᴛʀᴇᴀᴍs.</blockquote>\n\n<blockquote>➻ <b>sᴜᴅᴏ ʟɪsᴛ ᴍᴀɴᴀɢᴇᴍᴇɴᴛ</b> :\n➻ <b>/addsudo</b> : ᴀᴅᴅ ᴀ ɴᴇᴡ sᴜᴅᴏ ᴜsᴇʀ ᴛᴏ ʙᴏᴛ.\n➻ <b>/rmsudo</b> : ʀᴇᴍᴏᴠᴇ ᴀ ᴜsᴇʀ ғʀᴏᴍ sᴜᴅᴏ ʟɪsᴛ.\n➻ <b>/sudolist</b> : ᴄʜᴇᴄᴋ ᴀʟʟ ᴀᴜᴛʜᴏʀɪᴢᴇᴅ sᴜᴅᴏ ᴜsᴇʀs.\n\n❏ ᴛʜᴇsᴇ ᴄᴏᴍᴍᴀɴᴅs ᴀʀᴇ ʜɪɢʜʟʏ sᴇɴsɪᴛɪᴠᴇ, ᴜsᴇ ᴡɪᴛʜ ᴄᴀʀᴇ.</blockquote>\n"

help_restrict: "⊚ <b><u>ʙʟᴀᴄᴋʟɪsᴛ & ɢʟᴏʙᴀʟ ʙᴀɴ :</u></b>\n\n<blockquote>💮 <b>ʀᴇsᴛʀɪᴄᴛ sᴘᴇᴄɪғɪᴄ ᴄʜᴀᴛs ᴏʀ ᴜsᴇʀs ғʀᴏᴍ ᴜsɪɴɢ ᴛʜᴇ ʙᴏᴛ ɢʟᴏʙᴀʟʟʏ.</b></blockquote>\n\n<blockquote>➻ <b>ᴄʜᴀᴛ ʙʟᴀᴄᴋʟɪsᴛ</b> :\n➻ <b>/blacklistchat [ᴄʜᴀᴛ ɪᴅ]</b> : ʙᴀɴ ᴀ ᴄʜᴀᴛ ғʀᴏᴍ ᴜsɪɴɢ ʙᴏᴛ.\n➻ <b>/unblockchat [ᴄʜᴀᴛ ɪᴅ]</b> : ᴜɴʙᴀɴ ᴀ ʙʟᴀᴄᴋʟɪsᴛᴇᴅ ᴄʜᴀᴛ.\n➻ <b>/blacklisted</b> : sʜᴏᴡ ᴀʟʟ ʙʟᴀᴄᴋʟɪsᴛᴇᴅ ɢʀᴏᴜᴘs & ᴜsᴇʀs.</blockquote>\n\n<blockquote>➻ <b>ᴜsᴇʀ ʙʟᴏᴄᴋ</b> :\n➻ <b>/blockuser [ᴜsᴇʀɴᴀᴍᴇ/ɪᴅ]</b> : sᴛᴏᴘ ᴜsᴇʀ ғʀᴏᴍ ᴜsɪɴɢ ʙᴏᴛ.\n➻ <b>/unblockuser [ᴜsᴇʀɴᴀᴍᴇ/ɪᴅ]</b> : ᴀʟʟᴏᴡ ᴛʜᴇ ʙʟᴏᴄᴋᴇᴅ ᴜsᴇʀ.\n➻ <b>/blacklisted</b> : ᴠɪᴇᴡ ᴛʜᴇ ʟɪsᴛ ᴏғ ᴀʟʟ ʙʟᴏᴄᴋᴇᴅ ᴜsᴇʀs.</blockquote>\n"

help_thumb: "⊚ <b><u>ᴛʜᴜᴍʙɴᴀɪʟ sᴇᴛᴛɪɴɢs :</u></b>\n\n<blockquote>➻ <b>/nothumb</b> : ᴍᴀɴᴀɢᴇ sᴛʀᴇᴀᴍ ᴠɪsᴜᴀʟ sᴇᴛᴛɪɴɢs.\n\n💮 <b>ᴛᴏɢɢʟᴇ ᴀʟʙᴜᴍ ᴀʀᴛ ᴅɪsᴘʟᴀʏ. ᴅɪsᴀʙʟɪɴɢ ɪᴛ ʀᴇᴅᴜᴄᴇs ᴅᴀᴛᴀ ʟᴏᴀᴅ ᴀɴᴅ ᴍᴀɪɴᴛᴀɪɴs ᴀ ᴍɪɴɪᴍᴀʟɪsᴛ ᴄʜᴀᴛ ʟᴏᴏᴋ.</b>\n\n➻ <b>ᴏᴘᴛɪᴏɴs</b> :\n• <b>ᴇɴᴀʙʟᴇ</b> : ᴅɪsᴘʟᴀʏ ᴀʀᴛᴡᴏʀᴋ ᴡɪᴛʜ sᴛʀᴇᴀᴍ ɪɴғᴏ.\n• <b>ᴅɪsᴀʙʟᴇ</b> : sᴇɴᴅ ᴘᴜʀᴇ ᴛᴇxᴛ-ʙᴀsᴇᴅ ᴜᴘᴅᴀᴛᴇs.\n• <b>ᴄʟᴏsᴇ</b> : ᴅɪsᴍɪss ᴛʜᴇ ᴄᴏɴғɪɢᴜʀᴀᴛɪᴏɴ.\n\n❏ sᴇᴛᴛɪɴɢs ᴀʀᴇ sᴀᴠᴇᴅ ɪɴᴅɪᴠɪᴅᴜᴀʟʟʏ ᴘᴇʀ ᴄʜᴀᴛ.</blockquote>\n"

help_start: "⊚ <b><u>ʙᴀsɪᴄ ᴄᴏᴍᴍᴀɴᴅs :</u></b>\n\n<blockquote>➻ <b>/start</b> : ɪɴɪᴛɪᴀʟɪᴢᴇ ᴛʜᴇ ᴍᴜsɪᴄ sᴇʀᴠɪᴄᴇ.\n➻ <b>/help</b> : ᴀᴄᴄᴇss ᴛʜᴇ ᴄᴏᴍᴍᴀɴᴅ ɢᴜɪᴅᴇʟɪɴᴇs.\n➻ <b>/ping</b> : ᴍᴇᴀsᴜʀᴇ sʏsᴛᴇᴍ ʟᴀᴛᴇɴᴄʏ ᴀɴᴅ ᴘɪɴɢ.\n➻ <b>/position</b> : sʜᴏᴡ ᴄᴜʀʀᴇɴᴛ ᴛʀᴀᴄᴋ's ᴛɪᴍᴇsᴛᴀᴍᴘ.\n➻ <b>/reload</b> : ʀᴇғʀᴇsʜ ᴀᴅᴍɪɴ ᴅᴀᴛᴀ ᴄᴀᴄʜᴇ.\n➻ <b>/settings</b> : ᴀᴅᴊᴜsᴛ ᴄᴏɴғɪɢᴜʀᴀᴛɪᴏɴ ᴏᴘᴛɪᴏɴs.\n➻ <b>/lang</b> : sᴇʟᴇᴄᴛ ʏᴏᴜʀ ᴘʀᴇғᴇʀʀᴇᴅ ʟᴀɴɢᴜᴀɢᴇ.\n➻ <b>/bug</b> : ʀᴇᴘᴏʀᴛ ᴀɴ ɪssᴜᴇ ᴏʀ ᴘʀᴏʙʟᴇᴍ.\n➻ <b>/json</b> : sʜᴏᴡ ᴍᴇssᴀɢᴇ ᴊsᴏɴ sᴛʀᴜᴄᴛᴜʀᴇ.\n➻ <b>/sudolist</b> : ᴠɪᴇᴡ ᴛʜᴇ ʟɪsᴛ ᴏғ sᴜᴅᴏ ᴀᴅᴍɪɴs.\n➻ <b>/stats</b> : ᴠɪᴇᴡ ᴄᴏᴍᴘʀᴇʜᴇɴsɪᴠᴇ ʙᴏᴛ ᴍᴇᴛʀɪᴄs.</blockquote>\n"

help_autoplay: "⊚ <b><u>ᴀᴜᴛᴏᴘʟᴀʏ ᴄᴏɴᴛʀᴏʟ :</u></b>\n\n<blockquote>➻ <b>/autoplay</b> : ᴛᴏɢɢʟᴇ ᴛʜᴇ ᴀᴜᴛᴏᴘʟᴀʏ sᴇᴛᴛɪɴɢs ᴘᴀɴᴇʟ.\n➻ <b>/skip</b> : ᴘʟᴀʏ ᴛʜᴇ ɴᴇxᴛ ᴛʀᴀᴄᴋ ɪɴ ᴛʜᴇ ᴀᴜᴛᴏᴘʟᴀʏ ǫᴜᴇᴜᴇ.</blockquote>\n\n⊚ <b><u>ᴡʜᴀᴛ ɪs ᴀᴜᴛᴏᴘʟᴀʏ?</u></b>\n\n<blockquote>💮 <b>ᴀᴜᴛᴏᴘʟᴀʏ sᴇᴀᴍʟᴇssʟʏ ᴀᴅᴅs ʀᴇʟᴀᴛᴇᴅ ᴛʀᴀᴄᴋs ᴛᴏ ᴛʜᴇ ǫᴜᴇᴜᴇ ʙᴀsᴇᴅ ᴏɴ ʏᴏᴜʀ ᴄᴜʀʀᴇɴᴛ ᴘʟᴀʏʟɪsᴛ ғᴏʀ ɴᴏɴ-sᴛᴏᴘ ᴍᴜsɪᴄ.</b>\n\n➻ <b>ᴘᴀɴᴇʟ ᴏᴘᴛɪᴏɴs</b> :\n• <b>ᴇɴᴀʙʟᴇ</b> : ᴀᴄᴛɪᴠᴀᴛᴇ sᴍᴀʀᴛ ʀᴇᴄᴏᴍᴍᴇɴᴅᴀᴛɪᴏɴs.\n• <b>ᴅɪsᴀʙʟᴇ</b> : ᴅᴇᴀᴄᴛɪᴠᴀᴛᴇ sᴍᴀʀᴛ ʀᴇᴄᴏᴍᴍᴇɴᴅᴀᴛɪᴏɴs.\n• <b>ᴄʟᴏsᴇ</b> : ᴇxɪᴛ ᴛʜᴇ ᴄᴏɴᴛʀᴏʟ ᴘᴀɴᴇʟ.\n\n➻ <b>ɴᴏᴛᴇ</b> : ʀᴇǫᴜɪʀᴇs ᴀᴛ ʟᴇᴀsᴛ ᴏɴᴇ ᴀᴄᴛɪᴠᴇ sᴏɴɢ ᴛᴏ ғᴜɴᴄᴛɪᴏɴ.</blockquote>\n"

help_playlist: "⊚ <b><u>ᴘʟᴀʏʟɪsᴛ ᴄᴏᴍᴍᴀɴᴅs :</u></b>\n\n<blockquote>💮 <b>ᴄʀᴇᴀᴛᴇ, ᴏʀɢᴀɴɪᴢᴇ, ᴀɴᴅ ᴍᴀɴᴀɢᴇ ʏᴏᴜʀ ᴘᴇʀsᴏɴᴀʟ ᴘʟᴀʏʟɪsᴛs.</b></blockquote>\n\n<blockquote>➻ <b>/createplaylist</b> : ᴄʀᴇᴀᴛᴇ ᴀ ɴᴇᴡ ᴘʟᴀʏʟɪsᴛ.\n➻ <b>/deleteplaylist</b> : ᴅᴇʟᴇᴛᴇ ᴏɴᴇ ᴏғ ʏᴏᴜʀ ᴘʟᴀʏʟɪsᴛs.\n➻ <b>/addtoplaylist</b> : ᴀᴅᴅ ᴀ ᴛʀᴀᴄᴋ ᴛᴏ ᴀ ᴘʟᴀʏʟɪsᴛ.\n➻ <b>/removefromplaylist</b> : ʀᴇᴍᴏᴠᴇ ᴀ ᴛʀᴀᴄᴋ ғʀᴏᴍ ᴀ ᴘʟᴀʏʟɪsᴛ.\n➻ <b>/playlistinfo</b> : ᴅɪsᴘʟᴀʏ ɪɴғᴏʀᴍᴀᴛɪᴏɴ ᴀʙᴏᴜᴛ ᴀ ᴘʟᴀʏʟɪsᴛ.\n➻ <b>/myplaylists</b> : ʟɪsᴛ ᴀʟʟ ᴏғ ʏᴏᴜʀ ᴘʟᴀʏʟɪsᴛs.</blockquote>\n"

help_vclogs: "⊚ <b><u>ᴠᴄ ʟᴏɢɢᴇʀ ᴍᴏᴅᴜʟᴇ :</u></b>\n\n<blockquote>➻ <b>/vclogger [ᴏɴ|ᴏғғ]</b> : ᴛᴏɢɢʟᴇ ᴊᴏɪɴ/ʟᴇᴀᴠᴇ ᴀʟᴇʀᴛs.\n➻ <b>/vcstatus</b> : ᴠᴇʀɪғʏ ᴛʜᴇ ᴄᴜʀʀᴇɴᴛ ʟᴏɢɢᴇʀ sᴛᴀᴛᴇ.\n\n• ᴛʀᴀᴄᴋs ᴜsᴇʀ ɪᴅs ᴅᴜʀɪɴɢ ᴠᴄ ᴀᴄᴛɪᴠɪᴛʏ.\n• ᴀʟᴇʀᴛs ᴀʀᴇ ᴄʟᴇᴀɴᴇᴅ ᴀᴜᴛᴏᴍᴀᴛɪᴄᴀʟʟʏ ᴀғᴛᴇʀ 𝟓 sᴇᴄ.</blockquote>\n"

help_inline: "⊚ <b><u>ʙᴏᴛ ᴘʟᴀʏ ʙᴜᴛᴛᴏɴ ᴅᴇᴛᴀɪʟs :</u></b>\n\n<blockquote>💮 <b>ᴍᴀɴᴀɢᴇ ʏᴏᴜʀ ᴍᴜsɪᴄ ᴘʟᴀʏʙᴀᴄᴋ ᴅɪʀᴇᴄᴛʟʏ ᴛʜʀᴏᴜɢʜ ɪɴʟɪɴᴇ ʙᴜᴛᴛᴏɴs ᴡɪᴛʜ ᴇᴀsᴇ.</b></blockquote>\n\n<blockquote>➻ <b>ᴘʟᴀʏʙᴀᴄᴋ ᴄᴏɴᴛʀᴏʟs</b> :\n➻ <b>▷</b> : ʀᴇsᴜᴍᴇ ᴛʜᴇ ᴘᴀᴜsᴇᴅ sᴛʀᴇᴀᴍ.\n➻ <b>ɪɪ</b> : ᴘᴀᴜsᴇ ᴛʜᴇ ᴏɴɢᴏɪɴɢ sᴛʀᴇᴀᴍ.\n➻ <b>↻</b> : ʀᴇᴘʟᴀʏ ᴛʜᴇ ᴄᴜʀʀᴇɴᴛ sᴏɴɢ ғʀᴏᴍ sᴛᴀʀᴛ.\n➻ <b>‣‣ɪ</b> : sᴋɪᴘ ᴛʜᴇ ᴄᴜʀʀᴇɴᴛ ᴛʀᴀᴄᴋ ᴀɴᴅ ᴘʟᴀʏ ɴᴇxᴛ.\n➻ <b>▢</b> : sᴛᴏᴘ ᴛʜᴇ ᴘʟᴀʏʙᴀᴄᴋ ᴀɴᴅ ᴄʟᴇᴀʀ ǫᴜᴇᴜᴇ.\n\n➻ <b>sᴇᴇᴋ ᴀɴᴅ ɴᴀᴠɪɢᴀᴛɪᴏɴ</b> :\n➻ <b>-𝟣𝟧ˢ</b> : sᴇᴇᴋ ʙᴀᴄᴋᴡᴀʀᴅ ʙʏ 15 sᴇᴄᴏɴᴅs.\n➻ <b>𝟣𝟧ˢ+</b> : sᴇᴇᴋ ғᴏʀᴡᴀʀᴅ ʙʏ 15 sᴇᴄᴏɴᴅs.\n\n❏ ᴀʟʟ ʙᴜᴛᴛᴏɴs ᴏɴʟʏ ғᴏʀ ɢʀᴏᴜᴘ ᴀᴅᴍɪɴs.</blockquote>\n"
